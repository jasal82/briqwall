[workspace]
resolver = "2"
members = ["crates/briqwall-common", "crates/briqwall-service", "crates/briqwall-ui"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = { version = "0.4", features = ["std"] }
windows = "0.62"

[profile.release]
lto = true
codegen-units = 1
strip = true
