name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fremde Actions sind auf einen Commit festgelegt, nicht auf ein Tag: Ein Tag
# kann nachträglich auf anderen Code zeigen, ein Commit nicht. Dependabot
# (.github/dependabot.yml) schlägt neue Versionen als Pull Request vor.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Prüfen & testen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # Zweig "stable"
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Frontend – Abhängigkeiten
        working-directory: ui
        run: npm ci

      - name: Frontend – Typprüfung
        working-directory: ui
        run: npm run check

      - name: Frontend – Build
        working-directory: ui
        run: npm run build

      # The UI crate embeds the service binary (Tauri checks it at compile time).
      - name: Dienst bauen und als Beilage ablegen
        shell: pwsh
        run: |
          cargo build --locked -p briqwall-service
          New-Item -ItemType Directory -Force crates/briqwall-ui/binaries | Out-Null
          Copy-Item target/debug/briqwall-service.exe crates/briqwall-ui/binaries/briqwall-service-x86_64-pc-windows-msvc.exe

      - name: Rust – Tests
        run: cargo test --locked --workspace
